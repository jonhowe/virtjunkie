name: Deploy GitHub Pages

# Publishes public/. Enable GitHub Pages for this repo with Source set to
# GitHub Actions only when virtjunkie.com is ready to leave virtjunkie-public.
# Until then, a push still runs this workflow and the deploy job fails.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.139.4"
          extended: false
      - name: Build
        run: hugo --minify --cleanDestinationDir
      - name: Index search
        run: npx --yes pagefind@1.5.2 --site public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
