{{ define "main" }}
<article class="page">
  <h1>{{ .Title }}</h1>
  <div id="search"></div>
</article>
<script src="/pagefind/pagefind-ui.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const query = params.get("q") || "";
  const root = document.querySelector("#search");
  if (typeof PagefindUI === "undefined") {
    root.textContent = "Search is not available yet. From the Hugo repo, run scripts/index-search.sh and reload.";
  } else {
    const search = new PagefindUI({ element: "#search", showSubResults: true, autofocus: !query });
    if (query && typeof search.triggerSearch === "function") {
      search.triggerSearch(query);
    }
  }
</script>
{{ end }}
