  html: '<p>Interesting. There are few points which I would like to highlight.<br/>

    1. deploying VCSA using this method where there is no internet to download.<br/>

    2. Instead internet download, how about specifying alternative intranet locations such as FTP / NAS?<br/>

    3. The script developed based on linux environment, Windows version would much helpful</p>'
- id: 70
  parent: 69
  author: Jon Howe
  author_url: ''
  date: '2021-06-21T21:06:02-04:00'
  by_post_author: true
  html: '<p>Hey @KKrishna, thanks for stopping by. </p>

    <p>Re: #3 – You’re spot on.. I did use Linux to develop this, but it doesn’t make a difference. Just specify Windows paths to the 7-zip binary and your excel file and the rest should be fine.</p>

    <p>For #1, I actually designed this to run without internet access. An example for how to do this is here: <a href="https://www.virtjunkie.com/poor-mans-autodeploy/#Web_Server" rel="nofollow ugc">https://www.virtjunkie.com/poor-mans-autodeploy/#Web_Server</a></p>

    <p>For #2, love the idea of pulling via FTP. I’d welcome a PR here: <a href="https://github.com/jonhowe/Virtjunkie.com/tree/master/VCSA-AutoDeploy" rel="nofollow ugc">https://github.com/jonhowe/Virtjunkie.com/tree/master/VCSA-AutoDeploy</a></p>'
