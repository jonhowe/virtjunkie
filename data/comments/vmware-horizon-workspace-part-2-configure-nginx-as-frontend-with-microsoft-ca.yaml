  html: '<p>Hi,</p>

    <p>thank you for you great post. But i have still a question.</p>

    <p>I first installed the vapp in our network just for local network use. Now we decided to configure it to get external access. </p>

    <p>We use Kemp as Load Balancer in the DMZ. But if i come from WAN on workspace.**.de i get a access denied page from my horizon . Do you know what this can be?</p>

    <p>Also if i will change on configurator-va on fqdn and ssl from internal to use external load balancer and save the new config it did not change. how can that be?</p>

    <p>hope to hear from you soon.</p>

    <p>Best Regards<br/>

    Rob</p>'
