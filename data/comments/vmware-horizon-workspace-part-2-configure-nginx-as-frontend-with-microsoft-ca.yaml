  html: '<p>Hey Rob,</p>

    <p>Glad you liked the post, you can keep an eye out for more workspace posts as time goes on.</p>

    <p>I have not used Kemp, so I can’t really speak to whether or not there’s an issue there.</p>

    <p>I’ve got a couple of questions that might help identify the error:</p>

    <p>1.) Are you using an internal or external postgres database? I’ve seen an access denied error when using an incorrectly configured external db.</p>

    <p>2.) Does your Workspace FQDN point to your load balancer? </p>

    <p>3.) Did you paste a cert into the field when trying to switch to the external load balancer?</p>

    <p>4.) Do you get any error messages while switching to an external load balancer?</p>'
