  author: Roberto Leinardi
  author_url: https://plus.google.com/110804446791750062551
  date: '2020-05-27T03:14:56-04:00'
  by_post_author: false
  html: '<p>I’m in the same situation, the problem is that the current web version of WebEx Teams does not provide the same features as the Mac and Windows native clients!</p>

    <p>You cannot edit your messages, you cannot add or even view reactions and most of the time the chat history goes crazy and you don’t see new messages anymore.</p>

    <p>And yes, I know that there is a long running beta version that fixes some of these issues, but the beta version doesn’t allow to make or join audio/video calls! And, in these quarantine days, being able to join call conferences is a must.</p>

    <p>Please consider voting on the official Cisco User Community Feedback the entry for a native Linux client:<br/>

    <a href="https://ciscocollabcustomer.ideas.aha.io/ideas/WXCUST-I-61" rel="nofollow ugc">https://ciscocollabcustomer.ideas.aha.io/ideas/WXCUST-I-61</a></p>'
