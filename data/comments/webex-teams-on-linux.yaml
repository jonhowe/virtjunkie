  html: '<p>I ran the command below:</p>

    <p>$ nativefier -n “Webex-Teams” -p linux -a x64 -e 11.0.3 -i Pictures/cisco-webex-teams.png –tray <a href="https://teams.webex.com/" rel="nofollow ugc">https://teams.webex.com</a></p>

    <p>Preparing Electron app…</p>

    <p>Converting icons…</p>

    <p>Packaging… This will take a few seconds, maybe minutes if the requested Electron isn’t cached yet…<br/>

    Downloading electron-v11.0.3-linux-x64.zip: [====================================================================================================] 100% ETA: 0.0 seconds<br/>

    Packaging app for platform linux x64 using electron v11.0.3</p>

    <p>Finalizing build…<br/>

    App built to /home/jr/Webex-Teams-linux-x64 , move it wherever it makes sense for you and run the contained executable file (prefixing with ./ if necessary)<br/>

    Menu/desktop shortcuts are up to you, because Nativefier cannot know where you’re going to move the app. Search for “linux .desktop file” for help, or see <a href="https://wiki.archlinux.org/index.php/Desktop_entries" rel="nofollow ugc">https://wiki.archlinux.org/index.php/Desktop_entries</a></p>

    <p>This created a valid directory and everything looks good. My problem is I don’t recognize any executable file as the above instructions?</p>'
