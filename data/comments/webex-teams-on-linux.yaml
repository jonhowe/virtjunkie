  date: '2021-01-07T23:46:12-05:00'
  by_post_author: false
  html: '<p>nativefier –name ‘Webex’ ‘https://web.webex.com’ –internal-urls “.*(okta|cisco|spark|webex)\.(com|net).*” –single-instance</p>

    <p>heres my version of it allowing for okta 2fa. hoping it ends up in a search engine and helps someone 🙂</p>'
